apiVersion: v1
kind: ServiceAccount
metadata:
  name: mea-app
  namespace: mea

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mea-app-role
  namespace: mea
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mea-app-rolebinding
  namespace: mea
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mea-app-role
subjects:
- kind: ServiceAccount
  name: mea-app
  namespace: mea

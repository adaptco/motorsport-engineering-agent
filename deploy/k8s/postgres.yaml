apiVersion: v1
kind: ConfigMap
metadata:
  name: mea-config
  namespace: default
data:
  ENV: "production"
  LOG_LEVEL: "warning"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: mea-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_PASSWORD: changeme
  REDIS_PASSWORD: changeme
  DATABASE_URL: "postgresql://mea_prod:changeme@postgres:5432/mea_prod"
  REDIS_URL: "redis://:changeme@redis:6379/0"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: mea_prod
        - name: POSTGRES_USER
          value: mea_prod
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mea-secrets
              key: DATABASE_PASSWORD
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U mea_prod -d mea_prod
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U mea_prod -d mea_prod
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
      volumes:
      - name: init-scripts
        configMap:
          name: mea-init-scripts
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

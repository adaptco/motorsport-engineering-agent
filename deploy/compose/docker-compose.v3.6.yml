version: '3.9'
services:
  control_plane:
    build:
      context: ../containers/mea-v3.6
      dockerfile: Dockerfile
    image: mea-control-plane:v3.6
    environment:
      - RUNTIME_CONTRACT_BUNDLE=/app/contracts/runtime/agent_runtime_contract_bundle.schema.json
    ports:
      - "8080:8080"
    command: ["uvicorn", "control_plane.main:app", "--host=0.0.0.0", "--port=8080"]

  worker:
    build:
      context: ../containers/mea-v3.6
      dockerfile: Dockerfile
    image: mea-worker:v3.6
    environment:
      - RUNTIME_CONTRACT_BUNDLE=/app/contracts/runtime/agent_runtime_contract_bundle.schema.json
    command: ["uvicorn", "worker.main:app", "--host=0.0.0.0", "--port=8081"]

  mcp_server:
    build:
      context: ../containers/mea-v3.6
      dockerfile: Dockerfile
    image: mea-mcp-server:v3.6
    environment:
      - RUNTIME_CONTRACT_BUNDLE=/app/contracts/runtime/agent_runtime_contract_bundle.schema.json
    command: ["uvicorn", "mcp_server.main:app", "--host=0.0.0.0", "--port=8082"]

networks:
  default:
    name: mea-v3.6-network
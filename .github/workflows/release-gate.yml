name: release-gate

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  version-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version alignment
        shell: bash
        run: |
          set -euo pipefail
          pkg_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          PY
          )
          version_json_pkg=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('VERSION.json').read_text())['package_version'])
          PY
          )
          version_json_kernel=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('VERSION.json').read_text())['kernel_version'])
          PY
          )

          changelog_header=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          match = re.search(r'^##\s+v[^\n]+$', text, re.MULTILINE)
          if not match:
              raise SystemExit('No changelog version heading found')
          print(match.group(0))
          PY
          )

          expected_header="## v${version_json_kernel} / ${pkg_version}"

          test "$pkg_version" = "$version_json_pkg" || {
            echo "Mismatch: pyproject version ($pkg_version) != VERSION.json package_version ($version_json_pkg)"
            exit 1
          }

          test "$changelog_header" = "$expected_header" || {
            echo "Mismatch: first changelog heading '$changelog_header' != '$expected_header'"
            exit 1
          }

  required-ci-checks:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Ensure required checks succeeded on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;
            const required = ["quality-gate", "build-images"];

            const response = await github.rest.checks.listForRef({
              owner,
              repo,
              ref,
              per_page: 100,
            });

            const runs = response.data.check_runs;
            const byName = new Map(runs.map((run) => [run.name, run]));
            const failures = [];

            for (const name of required) {
              const run = byName.get(name);
              if (!run) {
                failures.push(`Missing required check run: ${name}`);
                continue;
              }
              if (run.status !== "completed" || run.conclusion !== "success") {
                failures.push(
                  `Check '${name}' not successful (status=${run.status}, conclusion=${run.conclusion})`
                );
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join("\n"));
            }

  deploy:
    runs-on: ubuntu-latest
    needs: [version-alignment, required-ci-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy gate passed
        run: echo "Deploy preconditions satisfied on main branch."

  publish:
    runs-on: ubuntu-latest
    needs: [version-alignment, required-ci-checks]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    steps:
      - name: Publish gate passed
        run: echo "Publish preconditions satisfied for release tag."

name: release-gate

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  checks: read

jobs:
  version-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate version alignment
        shell: bash
        run: |
          set -euo pipefail

          pkg_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text())
          print(data["project"]["version"])
          PY
          )"

          version_json_pkg="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("VERSION.json").read_text())
          print(data["package_version"])
          PY
          )"

          version_json_kernel="$(python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("VERSION.json").read_text())
          print(data["kernel_version"])
          PY
          )"

          changelog_header="$(python - <<'PY'
          import re
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text()
          match = re.search(r"^##\\s+v[^\\n]+$", text, re.MULTILINE)
          if not match:
              raise SystemExit("No changelog version heading found")
          print(match.group(0))
          PY
          )"

          expected_header="## v${version_json_kernel} / ${pkg_version}"

          test "${pkg_version}" = "${version_json_pkg}" || {
            echo "Mismatch: pyproject version (${pkg_version}) != VERSION.json package_version (${version_json_pkg})"
            exit 1
          }

          test "${changelog_header}" = "${expected_header}" || {
            echo "Mismatch: first changelog heading '${changelog_header}' != '${expected_header}'"
            exit 1
          }

  required-ci-checks:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Wait for required checks to complete successfully
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.sha;
            const required = ["quality-gate", "build-images"];
            const pollIntervalMs = 15000;
            const timeoutMs = 20 * 60 * 1000;
            const deadline = Date.now() + timeoutMs;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            function selectLatestRunsByName(runs) {
              const byName = new Map();
              for (const run of runs) {
                const existing = byName.get(run.name);
                const runTime = new Date(run.started_at ?? run.created_at);
                const existingTime = existing
                  ? new Date(existing.started_at ?? existing.created_at)
                  : null;

                if (!existing || runTime > existingTime) {
                  byName.set(run.name, run);
                }
              }
              return byName;
            }

            while (Date.now() < deadline) {
              const response = await github.rest.checks.listForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const runs = response.data.check_runs;
              const byName = selectLatestRunsByName(runs);
              const pending = [];
              const failures = [];

              for (const name of required) {
                const run = byName.get(name);
                if (!run) {
                  pending.push(`Check '${name}' has not started yet`);
                  continue;
                }

                if (run.status !== "completed") {
                  pending.push(`Check '${name}' still ${run.status}`);
                  continue;
                }

                if (run.conclusion !== "success") {
                  failures.push(
                    `Check '${name}' completed with conclusion=${run.conclusion}`
                  );
                }
              }

              if (failures.length > 0) {
                console.log("Traceability Check Failure Summary:");
                failures.forEach((f) => console.log(`- ${f}`));
                core.setFailed(failures.join("\n"));
                return;
              }

              if (pending.length === 0) {
                core.info(
                  "All required checks completed successfully. Traceability chain verified."
                );
                return;
              }

              core.info(
                `${pending.join("; ")}. Retrying in ${pollIntervalMs / 1000}s...`
              );
              await sleep(pollIntervalMs);
            }

            core.setFailed(
              `Timed out after ${timeoutMs / 60000} minutes waiting for required checks: ${required.join(", ")}`
            );

  deploy:
    runs-on: ubuntu-latest
    needs: [version-alignment, required-ci-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy gate passed
        run: |
          echo "Deploy preconditions satisfied on main branch."
          echo "Traceability Audit: $(date -u)"

  publish:
    runs-on: ubuntu-latest
    needs: [version-alignment, required-ci-checks]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    steps:
      - name: Publish gate passed
        run: |
          echo "Publish preconditions satisfied for release tag."
          echo "Traceability Audit: $(date -u)"

name: container-build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build control_plane image
        run: docker build --file Dockerfile --target control_plane --tag mea/control-plane:${{ github.sha }} .

      - name: Build worker image
        run: docker build --file Dockerfile --target worker --tag mea/worker:${{ github.sha }} .

      - name: Build mcp_server image
        run: docker build --file Dockerfile --target mcp_server --tag mea/mcp-server:${{ github.sha }} .

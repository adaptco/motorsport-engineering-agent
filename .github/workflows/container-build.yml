name: container-build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [control_plane, worker, mcp_server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.target }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ matrix.target }}-
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ matrix.target }}-latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  scan-images:
    needs: build-images
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        target: [control_plane, worker, mcp_server]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.target }}:${{ github.sha }}
          format: 'sarif'
          output: '${{ matrix.target }}-trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: '${{ matrix.target }}-trivy-results.sarif'
          category: 'trivy-${{ matrix.target }}'

  test-compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose -f docker-compose.yml config > /dev/null

      - name: Test compose up with build
        timeout-minutes: 5
        run: |
          docker compose up --build -d
          docker compose ps
          docker compose logs
          docker compose down

      - name: Verify healthchecks
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          for i in {1..60}; do
            healthy_count=$(docker compose ps | grep -c "(healthy)" || true)
            if [ "$healthy_count" -ge 4 ]; then
              echo "✓ Services are healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "ERROR: Services failed to become healthy"
              docker compose ps
              docker compose logs
              docker compose down
              exit 1
            fi
            sleep 2
          done
          docker compose down

  sbom-generation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image for SBOM
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: control_plane
          load: true
          tags: mea-sbom:latest
          cache-from: type=gha

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: mea-sbom:latest
          format: cyclonedx-json
          output-file: sbom-control-plane.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifacts
          path: sbom-*.json

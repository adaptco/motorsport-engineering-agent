name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MIN_KERNEL_VERSION: "3.8"

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate v3.8 kernel version
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def parse_version(value: str) -> tuple[int, ...]:
              return tuple(int(part) for part in value.split("."))

          current_raw = json.loads(Path("VERSION.json").read_text())["kernel_version"]
          minimum_raw = os.environ["MIN_KERNEL_VERSION"]
          current = parse_version(current_raw)
          minimum = parse_version(minimum_raw)
          print(f"Kernel version: {current}")
          if current < minimum:
              raise SystemExit(
                  f"ERROR: Kernel version must be >= {minimum_raw}. Current: {current_raw}"
              )
          print(f"✓ Kernel version validated: {current_raw}")
          PY

      - name: Validate runtime contracts present
        run: |
          if [ ! -f "contracts/runtime/agent_runtime_contract_bundle.schema.json" ]; then
            echo "ERROR: Runtime contract bundle not found at contracts/runtime/agent_runtime_contract_bundle.schema.json"
            exit 1
          fi
          echo "✓ Runtime contract bundle found"
          
          if [ ! -f "contracts/aero/aero_simulation_state.schema.json" ]; then
            echo "WARN: Aero simulation contract not found (optional for v3.8)"
          fi

  build-and-push:
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: control-plane
            target: control_plane
          - service: worker
            target: worker
          - service: mcp-server
            target: mcp_server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,prefix=${{ matrix.service }}-
            type=semver,pattern={{version}},prefix=${{ matrix.service }}-
            type=semver,pattern={{major}}.{{minor}},prefix=${{ matrix.service }}-
            type=sha,prefix=${{ matrix.service }}-
            type=raw,value=${{ matrix.service }}-latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-compose:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config > /dev/null

      - name: Validate v3.8 compose (if exists)
        run: |
          if [ -f "deploy/compose/docker-compose.v3.8.yml" ]; then
            docker compose -f docker-compose.yml -f deploy/compose/docker-compose.v3.8.yml config > /dev/null
            echo "✓ v3.8 compose topology validated"
          fi

  deploy-staging:
    needs: [build-and-push, test-compose]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    env:
      DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
      DEPLOY_USER: ${{ secrets.STAGING_USER }}
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip staging deploy when secrets are missing
        if: env.DEPLOY_KEY == '' || env.DEPLOY_HOST == '' || env.DEPLOY_USER == ''
        run: echo "Skipping staging deploy because required secrets are not configured."

      - name: Deploy to staging
        if: env.DEPLOY_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_USER != ''
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /opt/mea
          git pull origin main
          docker compose -f docker-compose.yml -f deploy/compose/staging.yml pull
          docker compose -f docker-compose.yml -f deploy/compose/staging.yml up -d
          docker compose -f docker-compose.yml -f deploy/compose/staging.yml exec -T control_plane alembic upgrade head
          EOF

      - name: Verify staging health
        if: env.DEPLOY_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_USER != ''
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /opt/mea
          echo "Waiting for control plane to be healthy..."
          for i in {1..30}; do
            if docker compose exec -T control_plane curl -f http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "✓ Control plane is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Control plane health check failed"
              exit 1
            fi
            sleep 2
          done
          EOF

  deploy-production:
    needs: [build-and-push, test-compose]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    env:
      DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
      DEPLOY_HOST: ${{ secrets.PROD_HOST }}
      DEPLOY_USER: ${{ secrets.PROD_USER }}
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if [[ ! "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid tag format. Expected v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Skip production deploy when secrets are missing
        if: env.DEPLOY_KEY == '' || env.DEPLOY_HOST == '' || env.DEPLOY_USER == ''
        run: echo "Skipping production deploy because required secrets are not configured."

      - name: Deploy to production
        if: env.DEPLOY_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_USER != ''
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /opt/mea
          git fetch origin
          git checkout ${{ github.ref_name }}
          docker compose -f docker-compose.yml -f deploy/compose/production.yml pull
          docker compose -f docker-compose.yml -f deploy/compose/production.yml up -d
          docker compose -f docker-compose.yml -f deploy/compose/production.yml exec -T control_plane alembic upgrade head
          EOF

      - name: Verify production health
        if: env.DEPLOY_KEY != '' && env.DEPLOY_HOST != '' && env.DEPLOY_USER != ''
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /opt/mea
          echo "Waiting for control plane to be healthy..."
          for i in {1..30}; do
            if docker compose exec -T control_plane curl -f http://localhost:8000/healthz > /dev/null 2>&1; then
              echo "✓ Control plane is healthy"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "ERROR: Control plane health check failed"
              exit 1
            fi
            sleep 2
          done
          EOF

  rollback:
    if: failure()
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Notify rollback
        run: |
          echo "Deployment failed. Manual rollback may be required."
          echo "Check deployment logs for details."
          echo "To rollback, run: ./deploy/rollback.sh <backup_directory>"

name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [control-plane, worker, mcp-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ matrix.service }}-
            type=raw,value=${{ matrix.service }}-latest,enable={{is_default_branch}}

      - name: Map service to dockerfile
        id: dockerfile
        run: |
          case "${{ matrix.service }}" in
            control-plane) echo "path=control_plane/Dockerfile" >> $GITHUB_OUTPUT ;;
            worker) echo "path=worker/Dockerfile" >> $GITHUB_OUTPUT ;;
            mcp-server) echo "path=mcp_server/Dockerfile" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.STAGING_DEPLOY_KEY != '' &&
      secrets.STAGING_HOST != '' &&
      secrets.STAGING_USER != ''
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /opt/mea
          git pull origin main
          docker compose -f docker-compose.yml -f deploy/compose/staging.yml pull
          docker compose -f docker-compose.yml -f deploy/compose/staging.yml up -d
          docker compose -f docker-compose.yml -f deploy/compose/staging.yml exec -T control_plane alembic upgrade head
          EOF

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      secrets.PROD_DEPLOY_KEY != '' &&
      secrets.PROD_HOST != '' &&
      secrets.PROD_USER != ''
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if [[ ! "${{ github.ref }}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid tag format. Expected v<major>.<minor>.<patch>"
            exit 1
          fi

      - name: Deploy to production
        env:
          DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.PROD_HOST }}
          DEPLOY_USER: ${{ secrets.PROD_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" << 'EOF'
          set -e
          cd /opt/mea
          git fetch origin
          git checkout ${{ github.ref_name }}
          docker compose -f docker-compose.yml -f deploy/compose/production.yml pull
          docker compose -f docker-compose.yml -f deploy/compose/production.yml up -d
          docker compose -f docker-compose.yml -f deploy/compose/production.yml exec -T control_plane alembic upgrade head
          EOF

  rollback:
    if: failure()
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    steps:
      - name: Notify rollback
        run: |
          echo "Deployment failed. Manual rollback may be required."
          echo "Check deployment logs for details."

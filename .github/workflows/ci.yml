name: mea-kernel-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest -q

  build-images:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build control plane image
        run: docker build -t mea/control-plane:${{ github.sha }} -f control_plane/Dockerfile .
      - name: Build MCP server image
        run: docker build -t mea/mcp-server:${{ github.sha }} -f mcp_server/Dockerfile .
      - name: Build worker image
        run: docker build -t mea/worker:${{ github.sha }} -f worker/Dockerfile .

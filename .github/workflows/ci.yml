name: ci

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install ruff mypy bandit

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --ignore-missing-imports --check-untyped-defs .

      - name: Security Scan
        run: bandit -r . -x ./tests,./venv

      - name: Test
        run: pytest -q

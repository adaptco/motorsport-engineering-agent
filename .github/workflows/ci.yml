name: mea-kernel-ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Lint with ruff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [ -n "$base_sha" ] && [ "$base_sha" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$base_sha"
            py_files="$(git diff --name-only "$base_sha" "${{ github.sha }}" -- '*.py')"
          else
            py_files="$(git ls-files '*.py')"
          fi
          if [ -z "$py_files" ]; then
            echo "No changed Python files to lint."
            exit 0
          fi
          printf '%s\n' "$py_files"
          mapfile -t changed_py < <(printf '%s\n' "$py_files")
          uv run ruff check "${changed_py[@]}"
          uv run ruff format --check "${changed_py[@]}"

      - name: Type check with mypy (if configured)
        continue-on-error: true
        run: |
          uv run mypy control_plane/ worker/ mcp_server/ --ignore-missing-imports

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v --cov=control_plane,worker,mcp_server --cov-report=xml --cov-report=term

      - name: Security audit (pip-audit)
        run: |
          uv run --with pip-audit pip-audit

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  dockerfile-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control_plane image (PR test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: control_plane
          load: true
          tags: mea-control-plane:test
          cache-from: type=gha

      - name: Verify control_plane image
        run: |
          docker image inspect mea-control-plane:test
          docker run --rm mea-control-plane:test python -m py_compile /app/control_plane/app.py

      - name: Build worker image (PR test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: worker
          load: true
          tags: mea-worker:test
          cache-from: type=gha

      - name: Build mcp_server image (PR test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: mcp_server
          load: true
          tags: mea-mcp-server:test
          cache-from: type=gha

  container-runtime-test:
    runs-on: ubuntu-latest
    needs: docker-build-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and test control_plane in isolation
        run: |
          docker build --target control_plane --tag mea-control-plane:test .
          # Test that the container starts without errors
          timeout 5 docker run --rm \
            -e DATABASE_URL="postgresql://test:test@localhost/test" \
            -e REDIS_URL="redis://localhost:6379/0" \
            mea-control-plane:test \
            uvicorn control_plane.app:app --help > /dev/null || true
          # Just verify the image is buildable and has required tools
          docker run --rm mea-control-plane:test which python curl

      - name: Build and test worker in isolation
        run: |
          docker build --target worker --tag mea-worker:test .
          # Verify Python modules load
          docker run --rm mea-worker:test python -c "import worker; print('✓ Worker module loads')"

      - name: Build and test mcp_server in isolation
        run: |
          docker build --target mcp_server --tag mea-mcp-server:test .
          docker run --rm mea-mcp-server:test which python curl

name: docker-compose-integration-test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_mea
          POSTGRES_USER: test_mea
          POSTGRES_PASSWORD: test_mea
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run integration tests with live services
        env:
          DATABASE_URL: postgresql://test_mea:test_mea@localhost/test_mea
          REDIS_URL: redis://localhost:6379/0
          TESTING: "true"
        run: |
          pytest tests/integration/ -v

  docker-compose-full-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install test dependencies
        run: |
          uv sync --extra dev --locked

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare live integration paths
        run: |
          mkdir -p .mea_tmp/integration-output .mea_tmp/runtime-logs .mea_tmp/mcp-runtime
          sudo chown -R 5678:5678 .mea_tmp/integration-output .mea_tmp/runtime-logs .mea_tmp/mcp-runtime

      - name: Build all services
        run: |
          docker compose build

      - name: Start full stack
        run: |
          docker compose up -d

      - name: Wait for V3.8 service health
        run: |
          for endpoint in http://127.0.0.1:8000/healthz http://127.0.0.1:7000/healthz; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$endpoint"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Service did not become healthy: $endpoint"
                docker compose ps
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run V3.8 live-stack telemetry and MCP integration tests
        env:
          MEA_RUN_INTEGRATION_TESTS: "1"
          MEA_CONTROL_PLANE_URL: http://127.0.0.1:8000
          MEA_MCP_SERVER_URL: http://127.0.0.1:7000
          MEA_INTEGRATION_HOST_OUTPUT_DIR: .mea_tmp/integration-output
        run: |
          uv run pytest -v tests/integration/test_live_stack_v38.py

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Control Plane Logs ==="
          docker compose logs control_plane
          echo ""
          echo "=== Worker Logs ==="
          docker compose logs worker
          echo ""
          echo "=== MCP Server Logs ==="
          docker compose logs mcp_server
          echo ""
          echo "=== Postgres Logs ==="
          docker compose logs postgres
          echo ""
          echo "=== Redis Logs ==="
          docker compose logs redis

      - name: Cleanup
        if: always()
        run: docker compose down -v

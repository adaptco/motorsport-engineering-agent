[project]
name = "mea-root-kernel"
version = "0.3.6"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.8.0",
  "jsonschema>=4.23.0",
  "referencing>=0.37.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "requests>=2.32.0",
  "PyJWT>=2.9.0",
  "cryptography>=43.0.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0",
  "pandas>=2.2.0",
  "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".mea_tmp", "runtime_logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = "(^\\.venv/|^\\.mea_tmp/|^runtime_logs/)"

[project]
name = "mea-root-kernel"
version = "0.3.8"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.52.1",
  "python-multipart>=0.0.32",
  "pydantic>=2.13.3",
  "jsonschema>=4.23.0",
  "referencing>=0.37.0",
  "psycopg[binary]>=3.3.4",
  "redis>=7.4.0",
  "requests>=2.32.0",
  "types-requests>=2.33.0.20260712",
  "pyjwt>=2.13.0",
  "cryptography>=50.0.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.3",
  "pandas>=2.2.0",
  "scipy>=1.17.1",
  "click>=8.3.3",
  "idna>=3.15",
  "starlette>=1.3.1",
  "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "httpx>=0.28.1",
  "ruff>=0.15.12",
  "mypy>=2.3.0",
  "pandas-stubs>=1.5.3",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".mea_tmp", "runtime_logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = "(^\\.venv/|^\\.mea_tmp/|^runtime_logs/|^control_plane/)"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260724",
]
# Note: control_plane is excluded here to avoid duplicate-module discovery by mypy in CI.
# The repository-wide mypy invocation remains non-blocking while monorepo package discovery is refined.

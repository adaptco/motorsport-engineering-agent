# Unified production docker-compose.yml for mea-root-kernel
# Usage:
#   docker compose up -d                    # Start all services
#   docker compose -f docker-compose.override.yml up  # Dev with hot reload

services:
  postgres:
    image: postgres:16-alpine
    container_name: mea-postgres
    environment:
      POSTGRES_DB: mea
      POSTGRES_USER: mea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mea}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mea -d mea"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_min_duration_statement=100
      - -c
      - log_statement=none
    networks:
      - mea-network
    mem_limit: 512m
    cpus: "1"

  redis:
    image: redis:7-alpine
    container_name: mea-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mea-network
    mem_limit: 256m
    cpus: "0.5"
    command: redis-server --appendonly yes --appendfsync everysec

  control_plane:
    build:
      context: .
      dockerfile: Dockerfile
      target: control_plane
    container_name: mea-control-plane
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp_server:
        condition: service_started
    restart: unless-stopped
    networks:
      - mea-network
    mem_limit: 512m
    cpus: "1"
    environment:
      PYTHONUNBUFFERED: "1"
      MCP_SERVER_BASE_URL: http://mcp_server:7000
    volumes:
      - ./tests/fixtures:/integration-fixtures:ro
      - ./.mea_tmp/integration-output:/integration-output
      - ./.mea_tmp/runtime-logs:/app/runtime_logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: mea-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      control_plane:
        condition: service_started
    restart: unless-stopped
    networks:
      - mea-network
    mem_limit: 1024m
    cpus: "2"
    environment:
      PYTHONUNBUFFERED: "1"

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp_server
    container_name: mea-mcp-server
    ports:
      - "7000:7000"
    restart: unless-stopped
    networks:
      - mea-network
    mem_limit: 512m
    cpus: "1"
    environment:
      PYTHONUNBUFFERED: "1"
      SESSION_LEDGER_DB_PATH: /runtime-state/session-ledger.db
    volumes:
      - ./.mea_tmp/mcp-runtime:/runtime-state
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  redis_data:

networks:
  mea-network:
    driver: bridge
